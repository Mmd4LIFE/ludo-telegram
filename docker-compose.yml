services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ludo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ludo_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ludo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ludo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ludonet

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ludo}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-ludo_secret}
      CLICKHOUSE_DB: ludo
    networks:
      - ludonet

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ludo}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-ludo_secret}
      CLICKHOUSE_DB: ludo
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - chdata:/var/lib/clickhouse
      - ./backend/analytics/clickhouse.xml:/etc/clickhouse-server/config.d/memory.xml:ro
      - ./backend/analytics/init.sql:/docker-entrypoint-initdb.d/01-ludo.sql:ro
    mem_limit: 384m
    networks:
      - ludonet

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Bind to localhost only — a Cloudflare Tunnel (or the host reverse proxy)
      # terminates TLS and forwards here. WEB_PORT lets several bots share one box.
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./webout:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - ludonet

networks:
  ludonet:

volumes:
  pgdata:
  chdata:
